name: Build Xiaozhi Servo Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1

    steps:
      - name: 1. 拉取你的修改版源码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. 注入中文字幕、大表情与语音唤醒配置
        run: |
          cat << 'EOF' >> sdkconfig.defaults
          CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI_LCD=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/16m.csv"
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_USE_WAKE_WORD_DETECT=y
          CONFIG_USE_AUDIO_PROCESSOR=y
          CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=y
          CONFIG_LANGUAGE_ZH_CN=y
          CONFIG_LCD_CUSTOM_EMOTE_OPS=y
          CONFIG_OTTO_EMOJI_GIF=y
          CONFIG_EMOJI_FONT_64=y
          EOF
          idf.py set-target esp32s3

      - name: 3. 编译并打包成单一 merged-binary.bin
        run: |
          idf.py build
          cd build
          esptool.py --chip esp32s3 merge_bin -o merged-binary.bin @flash_args

      - name: 4. 上传生成的 .bin 固件供你下载
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-servo-firmware
          path: build/merged-binary.bin
